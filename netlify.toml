# Netlify 部署配置
# ------------------------------------------------------------------
# 站点本身是"零构建"的静态站：仓库根目录就是发布内容，
# 所以 publish = "."，没有 build 命令。
#
# 需要平台帮忙的只有 /api/*：那些接口要访问外部网站
# （Pixiv 抽卡与图片、网易云搜索与试听），浏览器直连会被 CORS / 镜像策略挡掉，
# 本地是靠 server.mjs 代理的；线上由 netlify/functions/api.mjs 复用同一份实现。
#
# ⚠️ 这里**故意不写** /api/* 的 [[redirects]]，这一条踩过坑，别再"补"回来：
#   函数用 config.path = '/api/*' 自己声明路由（Functions v2 的官方做法）。
#   官方文档明确写了 —— 一旦设了 config.path，函数**只**在该路径可用，
#   默认地址 /.netlify/functions/<name> 不再存在（见 docs.netlify.com
#   「Configuration for functions → Routing」）。
#   而那条重写正是把 /api/* 转发到 /.netlify/functions/api/* 这个**已不存在**的地址，
#   于是每个接口都变成 Netlify 的 "Page not found" 404 —— 表现得像"函数根本没部署"。
#   （线上实测：上一版函数没有 config.path，重写能通；加了 config.path 之后立刻全 404。）

[build]
  publish = "."
  # 静态站没有构建步骤：不写 command，Netlify 直接用仓库内容发布
  #
  # 省额度用的一条规则：**只有站点内容真的变了才构建**。
  # Netlify 的约定是 —— ignore 命令退出 0 就跳过这次构建。
  # 于是这里判断"排除掉纯工具/文档之后，两次提交之间有没有差异"：
  #   · 只改了 tools/ deploy/ README.md .shots/ .gitignore → 退出 0 → 跳过构建（省一次部署与积分）
  #   · 改了 index.html src/ styles/ data/ assets/ 等 → 退出 1 → 正常构建
  # 用 $CACHED_COMMIT_REF..$COMMIT_REF（合并提交上 HEAD^ 不可靠），这是官方推荐写法。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools' ':(exclude)deploy' ':(exclude)README.md' ':(exclude).shots' ':(exclude).gitignore'"

[functions]
  directory = "netlify/functions"
  # esbuild 会把 server.mjs 及其相对 import 一起打进来（函数目录之外的文件也能被跟踪）。
  # included_files 是"万一没打包"的兜底：把 server.mjs 原样放到函数根目录，
  # 那样 `import '../../server.mjs'` 依然能解析到（/var/task/server.mjs）。
  # 两条同时存在没有副作用，只是多带一个文件。
  node_bundler = "esbuild"
  included_files = ["server.mjs", "auth.mjs", "storage.mjs"]

# 注意：**不要**再加 "/* → /index.html 200" 这种 SPA 通配回退。
# 本站是 hash 路由（#/music 这种），没有前端路由需要回退；
# 加了通配回退会把 data/album.json、assets/img/album/*.jpg 也一起改写成 index.html，
# 相册清单解析失败、图片全变成 HTML —— 随机相册就是这样被搞坏的。

[[headers]]
  # 静态图标/字体这类带版本或内容不变的资源：交给 CDN 长缓存
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  # 内容 JSON 与相册清单：改一次就该立刻生效，别让浏览器记死
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  # 站内图片：站点体积 99.5% 是图，反复回源最吃带宽额度。
  # 图片文件名不带哈希，所以不能设"一年"这种不可撤回的长缓存 ✗
  # —— 折中 30 天 + stale-while-revalidate：回访几乎不再回源，
  #    万一以后换了同名图，最多 30 天陈旧（照片归档可以接受）。
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[redirects]]
  # AI 模型不在仓库里，放在 GitHub Release（tag model-v1）。
  # Netlify 把 /model/… 代理到 Release，浏览器仍是同源请求，不用碰 CORS。
  # 本地 / 自托管由 server.mjs 的 /model/… 负责（优先读 assets/models/）。
  from = "/model/UVR-MDX-NET-Inst_HQ_3.onnx"
  to = "https://github.com/qiyuyu197-ctrl/fish-temple/releases/download/model-v1/UVR-MDX-NET-Inst_HQ_3.onnx"
  status = 200
  force = true

[[headers]]
  # AI 模型（~64MB）与 ONNX Runtime 的 wasm：内容不变，长缓存。
  # 文件名带模型/版本号，换模型就换文件名，所以可以放心 immutable。
  for = "/assets/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/model/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/onnxruntime-web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # 其它静态资源（src/ styles/ 等）：短缓存，改一次就生效
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
