# fish-temple —— docker compose（可选路径）
# ------------------------------------------------------------------
# 用法（在仓库根目录执行）：
#   sudo cp deploy/fish-temple.env.example deploy/fish-temple.env   # 填真实值，别提交
#   sudo docker compose -f deploy/docker-compose.yml up -d --build
#   sudo docker compose -f deploy/docker-compose.yml logs -f
#
# 前面仍然用 Caddy 反代（TLS 与证书续期交给它），所以这里只把端口映射到 127.0.0.1。

services:
  fish-temple:
    build:
      # 构建上下文是仓库根（Dockerfile 需要 COPY 整个站点）
      context: ..
      dockerfile: deploy/Dockerfile
    image: fish-temple:local
    container_name: fish-temple
    restart: unless-stopped

    # 环境变量：默认复用 systemd 那份（少一处配置漂移）。
    # 想独立一份就改成 ./fish-temple.env（同样别提交进仓库）。
    env_file:
      - /etc/fish-temple.env
    environment:
      PORT: "5173"
      HOST: "0.0.0.0"

    # 只对本机开放：公网走 Caddy → https://<你的域名>
    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      # ⚠️ 必须挂：容器内文件系统是临时的。这里把宿主机的 ../data 挂进容器的 /app/data，
      #    论坛帖、账号资料（昵称/头像）、站内播放历史、公告文章都在这个目录里。
      - ../data:/app/data
      # 想换数据目录（例如独立磁盘）：把上面一行换成
      #   - /var/lib/fish-temple/data:/app/data
      # 并同步在 /etc/fish-temple.env 里设 FT_DATA_DIR=/app/data

    # 容器自身的内存/进程兜底（1G 小机器上够用）
    deploy:
      resources:
        limits:
          memory: 512M
