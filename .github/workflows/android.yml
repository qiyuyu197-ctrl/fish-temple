name: Android APK

# 打一个能装的 APK，挂到 GitHub Release 上。
#
# 从 2.0 起安卓版是**纯本地**的：站点文件打进了 APK，启动时在本机 127.0.0.1
# 起服务（SiteServer.java），账号也是本机账号（LocalAuth.java）。
# 所以它不再依赖 GitHub Pages / Netlify。
#
# 什么时候跑：
#   · 推 app-v* 标签（如 app-v2.0.0）→ 构建并发布到 Release
#   · 手动 Actions → Run workflow → 只留构建产物，不发版（可勾 lite）

on:
  workflow_dispatch:
    inputs:
      lite:
        description: '精简版：不打包相册图（APK 小很多，插画板块会空）'
        type: boolean
        default: false
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: v
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="2.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION（code ${GITHUB_RUN_NUMBER}）"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 确认 Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager=$SDKMANAGER"
          echo "before: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "after:  $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"

      # 签名密钥必须跨构建稳定，否则新版本装不上去（会报"签名不一致"）。
      - name: 复用签名密钥
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 构建 APK
        id: build
        run: |
          set -o pipefail
          LITE=""
          if [ "${{ inputs.lite }}" = "true" ]; then LITE="-Plite"; fi
          gradle -p app/android assembleDebug --no-daemon --stacktrace \
            -PappVersionName="${{ steps.v.outputs.version }}" \
            -PappVersionCode="${{ steps.v.outputs.code }}" \
            $LITE 2>&1 | tee android-build.log

      # 失败时把日志尾部贴成 check-run 注解：公开仓库不用登录就能读。
      - name: 失败时贴日志尾部
        if: failure()
        run: |
          if [ ! -f android-build.log ]; then echo "::warning::没有 android-build.log"; exit 0; fi
          MSG=$(tail -c 3500 android-build.log | sed 's/%/%25/g' | sed 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle 构建失败::${MSG}"

      - name: 整理产物
        run: |
          set -eu
          mkdir -p dist
          SUFFIX=""
          if [ "${{ inputs.lite }}" = "true" ]; then SUFFIX="-lite"; fi
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/fish-temple-android-${SUFFIX:-full}-${{ steps.v.outputs.version }}.apk"
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fish-temple-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 鱼の灵庙 安卓版 ${{ steps.v.outputs.version }}
          files: dist/*.apk
          body: |
            ## 鱼の灵庙 · 安卓版 ${{ steps.v.outputs.version }}

            **纯本地**：站点和账号都在 APK 里，断网也能打开（相册、文章、工具、扫雷全离线）。

            - 第一次用：顶栏「登录」→ 填邮箱和密码就是注册（**第一个账号是站长**）
            - 账号存在手机上（`/data/data/com.qiyuyu.fishtemple/files/data/auth`），不进任何服务器
            - **网易云搜索 / 试听 / 歌词、Pixiv 抽卡**：2.1 起在 App 内用 Java 重做了匿名代理，可直接用（需要联网）
            - **网易云扫码登录**：2.2 起可用（weapi/eapi 加密 + ZXing 生成二维码），登录后能读「我的歌单」；
              云盘 / 每日推荐 / 登录态音频还没做，接口会明确回 501
            - 需要 Android 7.0（API 24）及以上；安装包约 290MB（相册图都打进去了）

            安装：下载 `.apk` → 手机上点开 → 允许「安装未知来源应用」→ 装。
